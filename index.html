<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gaze / xy</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    color: #000000;
    font-family: Arial, Helvetica, sans-serif;
  }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 64px 24px 96px;
  }

  h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin: 0 0 6px;
  }

  .sub {
    font-size: 13px;
    color: #444;
    margin: 0 0 32px;
    line-height: 1.5;
  }

  .status {
    margin: 0 0 24px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #555;
  }

  .dot {
    width: 0.1px;
    height: 0.1px;
    border-radius: 50%;
    background: #bbb;
    flex-shrink: 0;
  }

  .dot.live { background: #000; }

  .pad {
    position: relative;
    width: 100%;
    max-width: 420px;
    aspect-ratio: 1 / 1;
    margin: 0 auto;
    border: 1px solid #000;
    background:
      linear-gradient(#eee 1px, transparent 1px) 0 0/25% 25%,
      linear-gradient(90deg, #eee 1px, transparent 1px) 0 0/25% 25%;
    background-color: #fdfdfd;
  }
  .pad::before, .pad::after {
    content: "";
    position: absolute;
    background: #eee;
  }
  .pad::before { left: 50%; top: 0; bottom: 0; width: 1px; transform: translateX(-0.5px); }
  .pad::after  { top: 50%; left: 0; right: 0; height: 1px; transform: translateY(-0.5px); }

  .cursor {
    position: absolute;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #000;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    transition: left 0.05s linear, top 0.05s linear, opacity 0.2s ease;
    box-shadow: 0 0 0 5px rgba(0,0,0,0.08);
    opacity: 0.25;
    pointer-events: none;
  }
  .cursor.live { opacity: 1; }

  .axis-label {
    position: absolute;
    font-family: 'Arial', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: #999;
    text-transform: uppercase;
  }
  .axis-label.x0 { left: 6px; bottom: 6px; }
  .axis-label.x1 { right: 6px; bottom: 6px; }
  .axis-label.y0 { left: 6px; top: 6px; }
  .axis-label.y1 { left: 6px; bottom: 6px; transform: translateY(-14px); }

  .panel {
    margin-top: 24px;
    border: 1px solid #000;
    padding: 12px 16px;
  }

  .panel .row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    padding: 4px 0;
    border-bottom: 1px solid #eee;
  }

  .panel .row:last-child { border-bottom: none; }

  .panel .row span:first-child {
    color: #777;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: 10px;
  }

  .panel .row span:last-child {
    font-family: 'Arial', monospace;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }

  .transport {
    margin-top: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .transport button {
    background: #fff;
    border: 1px solid #000;
    color: #000;
    font-family: inherit;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 10px 18px;
    cursor: pointer;
  }

  .transport button:hover { background: #000; color: #fff; }
  .transport button:active { opacity: 0.7; }
  .transport button:disabled { opacity: 0.3; cursor: default; }
  .transport button:disabled:hover { background: #fff; color: #000; }

  .transport button.secondary {
    color: #555;
    border-color: #999;
  }
  .transport button.secondary:hover { background: #555; color: #fff; }

  .transport button.toggle.active {
    background: #000;
    color: #fff;
  }

  .hint {
    max-width: 420px;
    margin: 24px auto 0;
    text-align: center;
    font-size: 12px;
    line-height: 1.5;
    color: #777;
  }

  .error {
    max-width: 420px;
    margin: 16px auto 0;
    text-align: center;
    font-size: 12px;
    line-height: 1.6;
    color: #b91c1c;
    display: none;
  }

  #videoWrap {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 160px;
    height: 120px;
    border: 1px solid #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    overflow: hidden;
    background: #000;
  }
  body.show-cam #videoWrap { opacity: 1; }
  #video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }
</style>
</head>
<body>

  <main class="wrap">

    <h1>gaze / xy</h1>
    <p class="sub">
      Uses your webcam to track the position of your gaze. Sends it live to the audio engine as x/y.
      If left/right or up/down feel backwards, use the invert buttons above.
    </p>

    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">idle</span>
    </div>

    <div class="pad" id="pad">
      <span class="axis-label x0">0</span>
      <span class="axis-label x1">1</span>
      <span class="axis-label y0">1</span>
      <span class="axis-label y1">0</span>
      <div class="cursor" id="cursor"></div>
    </div>

    <section class="panel">
      <div class="row"><span>x</span><span id="xVal">0.500</span></div>
      <div class="row"><span>y</span><span id="yVal">0.500</span></div>
    </section>

    <div class="transport">
      <button id="startBtn" type="button">start</button>
      <button id="stopBtn" type="button" disabled>stop</button>
    </div>

    <div class="transport">
      <button id="camBtn" class="secondary" type="button">show camera</button>
      <button id="invertXBtn" class="secondary toggle" type="button">invert x</button>
      <button id="invertYBtn" class="secondary toggle" type="button">invert y</button>
    </div>


    <p class="error" id="errorMsg"></p>

  </main>

  <div id="videoWrap"><video id="video" autoplay playsinline muted></video></div>

<script src="audio_engine.js"></script>
<script type="module">
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const camBtn = document.getElementById('camBtn');
  const invertXBtn = document.getElementById('invertXBtn');
  const invertYBtn = document.getElementById('invertYBtn');
  const statusText = document.getElementById('statusText');
  const statusDot = document.getElementById('statusDot');
  const cursor = document.getElementById('cursor');
  const xVal = document.getElementById('xVal');
  const yVal = document.getElementById('yVal');
  const errorMsg = document.getElementById('errorMsg');
  const video = document.getElementById('video');

  let faceLandmarker = null;
  let stream = null;
  let rafId = null;
  let running = false;
  let invertX = false;
  let invertY = false;

  let smoothX = 0.5, smoothY = 0.5;
  const SMOOTHING = 0; // 0 = no smoothing, 1 = frozen

  const RIGHT_EYE = { outer: 33, inner: 133, upper: 159, lower: 145, iris: 468 };
  const LEFT_EYE  = { outer: 362, inner: 263, upper: 386, lower: 374, iris: 473 };

  // audio engine start

  let audioCtx = null;
  let loader = null;

  async function initPdAudio(){
    const heavyModule = await audio_engine_Module();
    loader = new heavyModule.AudioLibLoader();

    audioCtx = new AudioContext({ sampleRate: 44100, latencyHint: "interactive" });

    await loader.init({
      blockSize: 128,
      webAudioContext: audioCtx,
      printHook: (msg) => console.log("[pd]", msg),
      sendHook: (name, val) => console.log("[pd send]", name, val),
    });

    await audioCtx.resume();
    loader.start();
  }

  function sendToPatch(name, value){
    if (!loader) return;
    if (loader.webAudioWorklet) loader.sendFloatParameterToWorklet(name, value);
    else if (loader.audiolib) loader.audiolib.setFloatParameter(name, value);
  }

  function stopPdAudio(){
    if (loader) loader.stop();
    if (audioCtx) audioCtx.close();
    loader = null;
    audioCtx = null;
  }
  // end audio engine

  function setStatus(text, live){
    statusText.textContent = text;
    statusDot.classList.toggle('live', !!live);
  }

  function showError(msg){
    errorMsg.textContent = msg;
    errorMsg.style.display = 'block';
  }

  function clearError(){
    errorMsg.style.display = 'none';
  }

  function clamp01(v){
    return Math.max(0, Math.min(1, v));
  }

  function updateReadout(nx, ny){
    xVal.textContent = nx.toFixed(3);
    yVal.textContent = ny.toFixed(3);
    cursor.style.left = (nx * 100) + '%';
    cursor.style.top = (ny * 100) + '%';
    cursor.classList.add('live');

    sendToPatch('x', nx);
    sendToPatch('y', ny);
  }

  function eyeRatio(lm, eye){
    const c1 = lm[eye.outer], c2 = lm[eye.inner];
    const up = lm[eye.upper], lo = lm[eye.lower];
    const iris = lm[eye.iris];
    const minX = Math.min(c1.x, c2.x), maxX = Math.max(c1.x, c2.x);
    const minY = Math.min(up.y, lo.y), maxY = Math.max(up.y, lo.y);
    const rx = maxX > minX ? clamp01((iris.x - minX) / (maxX - minX)) : 0.5;
    const ry = maxY > minY ? clamp01((iris.y - minY) / (maxY - minY)) : 0.5;
    return { rx, ry };
  }

  function gazeFromBlendshapes(categories){
    const s = {};
    for (const c of categories) s[c.categoryName] = c.score;

    // positive h = looking toward subject's right, positive v = looking up
    const h = ((s.eyeLookOutRight - s.eyeLookInRight) +
               (s.eyeLookInLeft  - s.eyeLookOutLeft)) / 2;
    const v = ((s.eyeLookUpLeft  - s.eyeLookDownLeft) +
               (s.eyeLookUpRight - s.eyeLookDownRight)) / 2;

    return { nx: clamp01(0.5 + h), ny: clamp01(0.5 - v) };
  }

  async function setupFaceLandmarker(){
    const { FaceLandmarker, FilesetResolver } = await import(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14"
    );
    const filesetResolver = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );
    return FaceLandmarker.createFromOptions(filesetResolver, {
      baseOptions: {
        modelAssetPath:
          "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
        delegate: "GPU"
      },
      runningMode: "VIDEO",
      numFaces: 1,
      outputFaceBlendshapes: true,
      outputFacialTransformationMatrixes: false
    });
  }

  function loop(){
    if (!running) return;
    if (video.readyState >= 2) {
      const result = faceLandmarker.detectForVideo(video, performance.now());
      if (result.faceBlendshapes && result.faceBlendshapes.length > 0) {
        const categories = result.faceBlendshapes[0].categories;
        const { nx: gx, ny: gy } = gazeFromBlendshapes(categories);

        let nx = gx;
        let ny = gy;
        if (invertX) nx = 1 - nx;
        if (invertY) ny = 1 - ny;

        smoothX += (nx - smoothX) * (1 - SMOOTHING);
        smoothY += (ny - smoothY) * (1 - SMOOTHING);
        updateReadout(smoothX, smoothY);
      }
    }
    rafId = requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', async () => {
    if (running) return;
    clearError();
    startBtn.disabled = true;
    setStatus('loading model…');

    try {
      if (!faceLandmarker) {
        faceLandmarker = await setupFaceLandmarker();
      }
    } catch (err) {
      console.error(err);
      showError('Could not load the face-tracking model from the CDN. Check your connection and reload.');
      setStatus('failed to load');
      startBtn.disabled = false;
      return;
    }

    setStatus('starting audio engine…');
    try {
      await initPdAudio();
    } catch (err) {
      console.error(err);
      showError('Could not start the audio engine (audio_engine.js). Check the console for details.');
      setStatus('audio failed');
      startBtn.disabled = false;
      return;
    }

    setStatus('requesting camera…');
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { width: 480, height: 360 } });
      video.srcObject = stream;
      await new Promise(resolve => { video.onloadeddata = resolve; });

      running = true;
      setStatus('tracking', true);
      stopBtn.disabled = false;
      loop();
    } catch (err) {
      console.error(err);
      showError(
        'Could not access the camera. If you\'re viewing this inside an ' +
        'embedded preview, camera access may be blocked - try opening this ' +
        'HTML file directly in a browser tab instead.'
      );
      setStatus('camera blocked');
      startBtn.disabled = false;
    }
  });

  stopBtn.addEventListener('click', () => {
    if (!running) return;
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    if (stream) stream.getTracks().forEach(t => t.stop());
    stopPdAudio();
    stopBtn.disabled = true;
    startBtn.disabled = false;
    cursor.classList.remove('live');
    setStatus('idle');
  });

  camBtn.addEventListener('click', () => {
    document.body.classList.toggle('show-cam');
    camBtn.textContent = document.body.classList.contains('show-cam') ? 'hide camera' : 'show camera';
  });

  invertXBtn.addEventListener('click', () => {
    invertX = !invertX;
    invertXBtn.classList.toggle('active', invertX);
  });

  invertYBtn.addEventListener('click', () => {
    invertY = !invertY;
    invertYBtn.classList.toggle('active', invertY);
  });
</script>
</body>
</html>
